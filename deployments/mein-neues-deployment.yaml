apiVersion: apps/v1
kind: Deployment
metadata:
  name: mein-neues-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mein-app
  template:
    metadata:
      labels:
        app: mein-app
    spec:
      containers:
      - name: mein-container
        image: nginx:latest
        ports:
        - containerPort: 80
